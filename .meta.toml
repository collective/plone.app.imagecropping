# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.10.0"

[pyproject]
codespell_skip = "*.js,*.min.js,*.min.js.map,*.css.map,yarn.lock,robot_*,test_*"
dependencies_mappings = ["Pillow = ['PIL']"]
dependencies_ignores = "['Products.Five']"


extra_lines = """
[tool.hatch.build.targets.wheel]
packages = ["src/plone"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
"""

[gitignore]
extra_lines = """
test_*
robot_*
forest.*
"""


[tox]
test_matrix = { "6.2" = ["3.14","3.13", "3.12", "3.11", "3.10",], "6.1" = ["3.14","3.13", "3.12", "3.11", "3.10",] }